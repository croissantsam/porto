name: Build and Release Puerto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    # macos-latest tracks the newest GitHub-hosted macOS image, so builds always
    # use the newest Xcode/Swift toolchain without downloading one.
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Determine version
        id: version
        working-directory: ./Puerto
        run: |
          if git describe --tags --exact-match 2>/dev/null | grep -q '^v'; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            COUNT=$(git rev-list --count HEAD)
            SHA=$(git rev-parse --short HEAD)
            VERSION="0.0.${COUNT}-${SHA}"
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        working-directory: ./Puerto
        run: swift build -c release

      - name: Assemble .app bundle
        working-directory: ./Puerto
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
        run: |
          APP_DIR="${PWD}/Puerto.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"

          ./scripts/generate_info_plist.sh "$APP_DIR/Contents/Info.plist" "${VERSION}" "${BUILD_NUMBER}"
          plutil -lint "$APP_DIR/Contents/Info.plist"

          cp Resources/AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cp .build/release/Puerto "$APP_DIR/Contents/MacOS/Puerto"
          chmod +x "$APP_DIR/Contents/MacOS/Puerto"

          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Create zip artifact
        working-directory: ./Puerto
        run: |
          cd "${{ env.APP_DIR }}/.."
          zip -r Puerto-macos.zip Puerto.app
          echo "ZIP_PATH=${PWD}/Puerto-macos.zip" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Puerto ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ZIP_PATH }}

      - name: Upload .app as workflow artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Puerto-macos-${{ steps.version.outputs.VERSION }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 30

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set — skipping the Homebrew tap update."
            exit 0
          fi

          SHA256=$(shasum -a 256 "$ZIP_PATH" | cut -d' ' -f1)
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          rm -rf "$TAP_DIR"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/croissantsam/homebrew-tap.git" "$TAP_DIR"

          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|; s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" "$TAP_DIR/Casks/puerto.rb"

          # Fail loudly if either field didn't land.
          grep -q "version \"${VERSION}\"" "$TAP_DIR/Casks/puerto.rb"
          grep -q "sha256 \"${SHA256}\"" "$TAP_DIR/Casks/puerto.rb"

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/puerto.rb
          if git diff --cached --quiet; then
            echo "Cask is already up to date — nothing to push."
            exit 0
          fi
          git commit -m "puerto ${VERSION}"
          git push