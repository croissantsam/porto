name: Toolchain check

# The release build uses whatever Swift ships on the macos-latest runner image.
# GitHub updates those images on its own schedule, so this job compares the
# runner's Swift with the latest swift.org release and opens a tracking issue
# when they differ.

on:
  schedule:
    - cron: "37 6 * * 1" # Mondays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare Swift versions
    runs-on: macos-latest
    steps:
      - name: Check runner Swift against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          INSTALLED=$(swift --version | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -1)
          LATEST=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/swiftlang/swift/releases/latest \
            | python3 -c 'import json,sys; t=json.load(sys.stdin)["tag_name"]; print(t.removeprefix("swift-").removesuffix("-RELEASE"))')

          echo "Runner Swift: ${INSTALLED:-unknown}"
          echo "Latest Swift: ${LATEST}"

          TITLE="Newer Swift toolchain available"
          EXISTING=$(gh issue list --state open --limit 100 --json number,title | python3 -c "
          import json, sys
          for issue in json.load(sys.stdin):
              if issue['title'] == '$TITLE':
                  print(issue['number'])
                  break
          ")

          if [ -z "$INSTALLED" ] || [ "$INSTALLED" = "$LATEST" ]; then
            echo "Toolchain is up to date."
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "Resolved: the runner now ships Swift ${INSTALLED}."
              gh issue close "$EXISTING"
            fi
            exit 0
          fi

          BODY="The \`macos-latest\` runner ships Swift ${INSTALLED:-unknown}, but Swift ${LATEST} is available.

          GitHub updates runner images on its own schedule. To pick up a newer toolchain sooner, select a specific Xcode with \`sudo xcode-select -s /Applications/Xcode_<version>.app\` in the release workflow."

          if [ -n "$EXISTING" ]; then
            echo "Updating issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            echo "Creating tracking issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi